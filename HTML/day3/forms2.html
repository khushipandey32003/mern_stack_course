<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="text-align: center;">
    <h1>Html Form</h1>
    <hr>
    <br><br>
    <label for="first name">First Name:</label>
    <input type="text" id="first name" name="firstname" placeholder="firstname">
    <br><br>
     <label for="last name">Last Name:</label>
    <input type="text" id="last name" name="lastname" placeholder="Lastname">
    <br><br>
     <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" placeholder="dd/mm/yyyy">
    <br><br>
     <label for="email id">Email id:</label>
    <input type="email" id="email id" name="emailid" placeholder="abc12@gmail.com">
    <br><br>
    <label for="number">Mobile Number:</label>
    <input type="number" id="number" name="number" placeholder="00000 00000">
    <br><br><br>
    <button type="submit">SUBMIT</button>
    <button  type="reset">RESET</button>
<hr>
</div>
</body>
</html>
